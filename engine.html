<!doctype html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0A0F1E;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;color:#F5F2EA;

.abs{position:absolute}.c{left:0;width:1080px;text-align:center}
.an{font-family:'Anton','Archivo Black',sans-serif;font-weight:400;letter-spacing:.012em}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 20%,rgba(255,200,61,.14),transparent 70%),radial-gradient(800px 800px at 88% 96%,rgba(53,224,161,.09),transparent 70%),#0A0F1E}

.vig{position:absolute;inset:0;background:radial-gradient(1250px 1500px at 50% 44%,transparent 52%,rgba(0,0,0,.6))}
.sc{position:absolute;inset:0;display:none}
svg.ic{display:block;fill:currentColor}

.tag.coral{background:var(--coral);color:#1b0b05}.tag.mint{background:var(--mint);color:#06231a}.tag.amber{background:var(--amber);color:#17120a}

.kick{left:60px;top:290px;font-weight:800;font-size:32px;letter-spacing:.2em;color:var(--amber)}
#brand{left:60px;top:226px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:30px;letter-spacing:.16em;color:rgba(245,242,234,.86)}
#brand i{display:block;width:18px;height:18px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 7px rgba(255,200,61,.22)}

#foot{left:60px;width:870px;top:1240px;font-weight:500;font-size:25px;color:var(--muted)}

/* people: gancho con N personas */

.cal-ring{position:absolute;inset:-8px;border-radius:20px;border:5px solid var(--amber);opacity:0}
.cal-lab{position:absolute;left:50%;top:-30px;white-space:nowrap;font-weight:900;font-size:24px;letter-spacing:.08em;padding:4px 12px;border-radius:8px;background:var(--amber);color:#17120a;z-index:3}

/* ranges: bandas de monto por fila */

/* payout: cifra protagonista + quienes cobran + nota */
.py-hero{top:282px;font-size:330px;line-height:1.02;color:var(--mint);text-shadow:0 18px 60px rgba(53,224,161,.26)}
.py-hero small{font-size:128px;margin-right:22px;color:#F5F2EA}
.py-label{top:646px;font-weight:800;font-size:44px;letter-spacing:.14em}
.py-row{left:0;width:1080px;top:748px;display:flex;justify-content:center;gap:12px}

/* equation: A (op) B */

/* bars: ranking con barras */

/* columns: comparacion con columnas verticales */
.cl-wrap{top:400px;height:800px;display:flex;align-items:flex-end;justify-content:center}
.cl-c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cl-v{display:inline-block;white-space:nowrap;font-size:96px;line-height:1.05;margin-bottom:14px;transform-origin:50% 100%}
.cl-b{width:100%;border-radius:22px 22px 4px 4px}
.cl-l{height:118px;padding-top:16px;text-align:center;white-space:nowrap}
.cl-l b{display:block;font-weight:800;font-size:44px;line-height:1.1}.cl-l small{display:block;font-weight:600;font-size:28px;color:var(--muted);margin-top:6px}

/* steps: linea de tiempo */
.sp-rail{left:152px;width:6px;border-radius:3px;background:linear-gradient(var(--amber),var(--mint));transform-origin:top}
.sp-n{left:60px;width:960px;display:flex;gap:28px;align-items:flex-start}
.sp-n .d{flex:0 0 190px;height:92px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:58px;line-height:1;padding-bottom:6px}
.sp-n .tx{font-weight:800;font-size:45px;line-height:1.16;padding-top:2px}

/* stat: una cifra protagonista + contexto */
.stt-hero{top:316px;height:336px;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 90%}
.stt-hero span{display:inline-block;white-space:nowrap;font-size:320px;line-height:1.02}
.stt-hero small{font-size:.39em;color:#F5F2EA}
.stt-label{top:674px;font-weight:800;font-size:44px;letter-spacing:.14em}
.stt-label span{display:inline-block;white-space:nowrap}
.stt-chips{top:770px;display:flex;justify-content:center;gap:14px}
.stt-rows{left:150px;width:780px;top:872px}
.stt-dots{left:150px;width:780px;top:876px}
.stt-grid{display:grid;grid-auto-flow:column;justify-content:center}
.stt-grid i{display:block;border-radius:5px;background:rgba(255,255,255,.11)}
.stt-dl{margin-top:16px;text-align:center;font-weight:700;font-size:27px;color:var(--muted)}
.stt-rows .br-top b{font-size:38px}.stt-rows .br-top span{font-size:34px}.stt-rows .br-track{height:28px;border-radius:14px}.stt-rows .br-bar{border-radius:14px}

/* line: serie(s) en el tiempo */
.ln-hero{left:60px;top:334px;display:flex;align-items:baseline;gap:22px;white-space:nowrap}
.ln-hero b{font-size:150px;line-height:1.05;font-weight:400}
.ln-hero small{font-weight:800;font-size:34px;letter-spacing:.1em;color:var(--muted)}
.ln-leg{left:60px;display:flex;gap:26px;font-weight:800;font-size:34px;white-space:nowrap}
.ln-leg div{display:flex;align-items:center;gap:12px}.ln-leg i{display:block;width:34px;height:10px;border-radius:5px}
.ln-box{left:60px;width:870px}
.ln-box svg{display:block;overflow:visible}
.ln-box text{font-family:'Inter',sans-serif;font-weight:700;font-size:30px;fill:#9AA6C2}
.ln-pill{position:absolute;white-space:nowrap;font-weight:900;font-size:36px;padding:6px 16px;border-radius:12px;font-variant-numeric:tabular-nums}

/* split: partes de un total (dona) */
.sl-don{left:310px;top:384px;width:460px;height:460px}
.sl-don svg{display:block}
.sl-mid{position:absolute;left:90px;top:90px;width:280px;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sl-mid b{display:inline-block;white-space:nowrap;font-size:96px;line-height:1.05;font-weight:400}
.sl-mid small{font-weight:800;font-size:26px;letter-spacing:.14em;color:var(--muted);margin-top:4px}
.sl-rows{left:150px;width:780px;top:884px}
.sl-row{display:flex;align-items:center;gap:20px}
.sl-row i{flex:0 0 44px;height:44px;border-radius:11px}
.sl-row b{flex:1;font-weight:800;white-space:nowrap}
.sl-row span{font-weight:700;font-size:36px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.sl-row em{flex:0 0 132px;text-align:right;font-style:normal;font-size:68px;line-height:1}

/* outro */
.ou-em{left:390px;top:300px;width:300px;height:300px;border-radius:50%;border:5px solid rgba(255,200,61,.9);background:radial-gradient(circle,rgba(255,200,61,.16),rgba(255,200,61,0) 72%)}
.ou-base{position:absolute;left:54px;right:54px;bottom:72px;height:6px;border-radius:3px;background:rgba(245,242,234,.55)}
.ou-bars{position:absolute;left:68px;right:68px;bottom:82px;height:160px;display:flex;align-items:flex-end;justify-content:space-between}
.ou-bars i{display:block;width:30px;border-radius:8px 8px 2px 2px;background:var(--soft);transform-origin:bottom}
.ou-bars i.k{background:var(--mint);box-shadow:0 0 28px rgba(53,224,161,.6)}
.ou-w1{top:640px;line-height:1.05}.ou-w2{top:852px;line-height:1.05;color:var(--amber)}
.ou-tag{top:1096px;font-weight:700;font-size:46px}
.ou-foot{left:150px;width:780px;top:1168px;text-align:center;font-weight:500;font-size:25px;line-height:1.32;color:var(--muted)}
</style>

<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-person" viewBox="0 0 100 100"><circle cx="50" cy="33" r="21"/><path d="M10 100c0-26 17-41 40-41s40 15 40 41z"/></symbol>

</svg>

<script>
const SPEC = /*SPEC*/;
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const pr = (t,s,d) => clamp((t-s)/d);
const eo = x => 1-Math.pow(1-x,3);
const eb = x => {const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const mark = s => esc(s).replace(/\*(.+?)\*/g,'<b>$1</b>');
const br = s => esc(s).replace(/\n/g,'<br>');
const ico = (n,w,h) => `<svg class="ic" width="${w}" height="${h}"><use href="#i-${n}"/></svg>`;
const fit = (txt,base,per,minv) => Math.max(minv,Math.min(base,Math.floor(per/Math.max(1,Math.max(...String(txt).split('\n').map(l=>l.length))))));
const COL = {amber:'#FFC83D',coral:'#FF6A3D',mint:'#35E0A1',soft:'#C9D2E8',white:'#F5F2EA'};
const DARK = {amber:'#17120a',coral:'#1b0b05',mint:'#06231a',soft:'#0A0F1E',white:'#0A0F1E'};
const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
function st(el,o,tr){ el.style.opacity=o; el.style.transform=tr||'none'; }
function up(el,p,dy=46){ const e=eo(p); st(el,e,`translateY(${(1-e)*dy}px)`); }
function pop(el,p,from=.55){ const e=p<=0?0:eb(p); st(el,clamp(p*3),`scale(${from+(1-from)*e})`); }
function slam(el,p,from=2.3,rot=0){ const e=eo(p); st(el,clamp(p*4),`rotate(${rot}deg) scale(${from+(1-from)*e})`); }
const q = (el,s) => el.querySelector(s), qa = (el,s) => [...el.querySelectorAll(s)];
const sm = x => x*x*(3-2*x);
const smInv = y => { let a=0,b=1; for(let i=0;i<24;i++){ const m=(a+b)/2; if(sm(m)<y) a=m; else b=m; } return (a+b)/2; };
const fmt = (v,d=0) => { const z=Math.abs(v).toFixed(d).split('.'); return (v<0?'-':'')+z[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(d?','+z[1]:''); };
/* fitW: achica la letra de un elemento (inline-block, nowrap) hasta que entre en mw px. Solo funciona durante build (la escena esta visible). */
function fitW(e,mw){ if(!e) return; const w=e.offsetWidth; if(w>mw) e.style.fontSize=Math.floor(parseFloat(getComputedStyle(e).fontSize)*mw/w)+'px'; }
let UID=0;

/* Cada tipo de escena: build(el,p) arma el DOM y devuelve referencias; draw(r,p,t,C) pinta el instante t.
   C.s = inicio de la escena; C.cue(k) = inicio del k-esimo fragmento de subtitulo de la escena. */
const REG = {
 people:{
