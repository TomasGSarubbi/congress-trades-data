name: Fetch congressional trades

on:
  schedule:
    # 12:30 UTC = 09:30 en Buenos Aires. Corre todos los días.
    - cron: "30 12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/fetch.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        run: python scraper/run.py

      - name: Commit data
        run: |
          git config user.name "trades-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          # Rebase por si main avanzó mientras corría el job (evita push rechazado)
          git pull --rebase origin main
          git push

      - name: Build site
        run: python site/build.py

      - name: Commit site
        run: |
          git config user.name "trades-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "site: $(date -u +%F)"
          # Data is already committed and pushed above, so a failure in the
          # site build can never cost us a day of scraped data.
          git pull --rebase origin main
          git push
